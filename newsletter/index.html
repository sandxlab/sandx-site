<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter — SandX.io</title>
  <meta name="description" content="SandX infrastructure updates and research notes. Coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design Tokens (mirrors main site) ─── */
    :root {
      --bg:         #0a0a0a;
      --bg-2:       #111111;
      --text:       #f0ede8;
      --text-muted: #7a7570;
      --accent:     #c8a870;
      --border:     #222222;
      --border-2:   #2e2e2e;
      --font:  Inter, system-ui, -apple-system, sans-serif;
      --mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --nav-h: 60px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── Nav ─── */
    nav {
      position: sticky;
      top: 0;
      height: var(--nav-h);
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    .nav-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 28px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }
    .logo .dot { color: var(--accent); }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-links a {
      font-size: 14px;
      color: var(--text-muted);
      transition: color 0.15s ease;
    }
    .nav-links a:hover { color: var(--text); }

    /* ─── Main content ─── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 28px;
    }

    .card {
      max-width: 540px;
      width: 100%;
      text-align: center;
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      border: 1px solid rgba(200, 168, 112, 0.35);
      padding: 5px 12px;
      border-radius: 4px;
      margin-bottom: 36px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .sub {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.75;
      margin-bottom: 48px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      border: 1px solid var(--border-2);
      padding: 10px 20px;
      border-radius: 6px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .back-link:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }
    .back-link .arrow { font-size: 16px; line-height: 1; }

    /* ─── Footer ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 28px;
      text-align: center;
    }
    footer p {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">SandX<span class="dot">.</span>io</a>
      <div class="nav-links">
        <a href="/#research">Research</a>
        <a href="/#docs">Docs</a>
        <a href="/blog/">Blog</a>
        <a href="https://github.com/sandxlab" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="card">
      <div class="tag">Newsletter</div>
      <h1>Coming soon.</h1>
      <p class="sub">
        Infrastructure updates, research notes, and what we're building at SandX —
        launching shortly. Check back soon or watch the
        <a href="https://github.com/sandxlab" target="_blank" rel="noopener"
           style="color: var(--accent); text-decoration: underline; text-decoration-color: rgba(200,168,112,0.4);">GitHub org</a>
        in the meantime.
      </p>
      <a href="/" class="back-link">
        <span class="arrow">&#8592;</span>
        Back to SandX.io
      </a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SandX Lab &mdash; Apache 2.0</p>
  </footer>

</body>
</html>
